version: '3.8'

services:
  centipede-ui-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: centipede-os-ui-dev
    environment:
      - PORT=3000
      # Configure a trusted HTTPS Kingdom endpoint explicitly for cross-container access.
      - KINGDOM_API_URL=${KINGDOM_API_URL:-}
      - KINGDOM_API_TOKEN=${KINGDOM_API_TOKEN:-}
      - OLLAMA_API_URL=http://localhost:11434
      - NODE_ENV=development
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
