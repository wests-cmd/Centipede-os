# Centipede uses Debian's live-media install modules and order. This settings
# file keeps the upstream sequence while making the target selection and
# irreversible install confirmation explicit.
---
modules-search: [ local, /usr/lib/calamares/modules ]
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - dpkg-unsafe-io
      - sources-media
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - bootloader-config
      - grubcfg
      - bootloader
      - packages
      - luksbootkeyfile
      - plymouthcfg
      - initramfscfg
      - initramfs
      - dpkg-unsafe-io-undo
      - sources-media-unmount
      - sources-final
      - umount
  - show:
      - finished
branding: centipede
prompt-install: true
dont-chroot: false

