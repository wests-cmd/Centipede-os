---
# No disk operation is selected when the installer opens. The user must choose
# a device and review the summary before Calamares starts writing partitions.
initialPartitioningChoice: none
defaultFileSystemType: ext4
initialSwapChoice: none
efi:
  mountPoint: /boot/efi
  recommendedSize: 300MiB
  minimumSize: 32MiB
essentialMounts: ["live-*", "control", "ventoy"]

