name: Documentation navigation

on:
  pull_request:
    paths:
      - 'README.md'
      - 'DOWNLOADS.md'
      - 'release/published-preview.json'
      - 'docs/**'
      - 'scripts/check_docs.py'
      - 'scripts/check-download-assets.py'
      - 'scripts/test_check_download_assets.py'
      - '.github/workflows/docs.yml'
  push:
    branches: ['main']
    paths:
      - 'README.md'
      - 'DOWNLOADS.md'
      - 'release/published-preview.json'
      - 'docs/**'
      - 'scripts/check_docs.py'
      - 'scripts/check-download-assets.py'
      - 'scripts/test_check_download_assets.py'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_docs.py
      - name: Test pinned preview tag, published assets and link integrity offline
        run: python -m unittest discover -s scripts -p 'test_check_download_assets.py' -v
      - name: Confirm every recommended preview download exists at the pinned release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check-download-assets.py
