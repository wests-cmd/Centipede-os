name: Centipede verified multi-platform release

on:
  push:
    tags:
      - 'v*'
  # GITHUB_TOKEN-created tags do not produce new push-triggered Actions runs.
  # The exact-tag coordinator invokes this through workflow_dispatch instead.
  workflow_dispatch:

concurrency:
  group: centipede-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-gate:
    name: Refuse uncertified stable releases
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Verify candidate tag or exact-source GA approval
        env:
          CENTIPEDE_STABLE_RELEASE_APPROVED: ${{ vars.CENTIPEDE_STABLE_RELEASE_APPROVED }}
          CENTIPEDE_GA_APPROVED_SHA: ${{ vars.CENTIPEDE_GA_APPROVED_SHA }}
        run: bun scripts/check-release-gate.ts

  platforms:
    needs: release-gate
    name: Build verified platform targets
    uses: ./.github/workflows/platform-builds.yml
    secrets: inherit

  desktop:
    needs: release-gate
    name: Test and build desktop bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun x tsc --noEmit
      - run: bun run lint:reality
      - run: bun test
      - name: Build desktop web bundle
        run: bun scripts/build-release.ts --target=desktop
      - uses: actions/upload-artifact@v4
        with:
          name: centipede-desktop-release-bundle
          path: release/desktop/
          if-no-files-found: error

  publish:
    name: Validate and publish verified artifacts
    needs: [platforms, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          path: release/platforms
      - name: Place desktop artifact in canonical target directory
        run: |
          mkdir -p release/desktop
          cp release/platforms/centipede-desktop-release-bundle/* release/desktop/
      - name: Validate artifacts, release channel, GA approval and checksums
        env:
          CENTIPEDE_STABLE_RELEASE_APPROVED: ${{ vars.CENTIPEDE_STABLE_RELEASE_APPROVED }}
          CENTIPEDE_GA_APPROVED_SHA: ${{ vars.CENTIPEDE_GA_APPROVED_SHA }}
        run: bun scripts/create-platform-release-manifest.ts
      - name: Publish verified assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/desktop/*
            release/iso/*
            release/live-usb/*
            release/vm/*
            release/docker/*
            release/manifests/*.json
            release/release-manifest.json
            release/SHA256SUMS
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          make_latest: ${{ contains(github.ref_name, '-rc.') && 'false' || 'true' }}
          generate_release_notes: true
