name: Centipede verified multi-platform release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  platforms:
    name: Build verified platform targets
    uses: ./.github/workflows/platform-builds.yml
    secrets: inherit

  desktop:
    name: Test and build desktop bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun x tsc --noEmit
      - run: bun run lint:reality
      - run: bun test
      - name: Build desktop web bundle
        run: bun scripts/build-release.ts --target=desktop
      - uses: actions/upload-artifact@v4
        with:
          name: centipede-desktop-release-bundle
          path: release/desktop/
          if-no-files-found: error

  publish:
    name: Validate and publish verified artifacts
    needs: [platforms, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          path: release/platforms
      - name: Place desktop artifact in canonical target directory
        run: |
          mkdir -p release/desktop
          cp release/platforms/centipede-desktop-release-bundle/* release/desktop/
      - name: Validate artifacts and generate the authoritative manifest and checksums
        run: bun scripts/create-platform-release-manifest.ts
      - name: Publish verified assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/desktop/*
            release/iso/*
            release/live-usb/*
            release/vm/*
            release/android/*
            release/docker/*
            release/manifests/*.json
            release/release-manifest.json
            release/SHA256SUMS
          draft: false
          name: Centipede OS ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          body: >-
            ${{ contains(github.ref_name, '-rc.') && 'PRE-RELEASE CANDIDATE: the Centipede-branded live system is available to try. The guided disk installer has not passed a separate-target install/reboot and source-media safety test. Use live mode only; do not install to a real disk.' || 'Verified stable Centipede OS release. See the release notes and target manifests for platform-specific capabilities.' }}
          generate_release_notes: true
