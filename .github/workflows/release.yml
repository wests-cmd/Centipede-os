name: Centipede verified multi-platform release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  platforms:
    name: Build every platform target
    uses: ./.github/workflows/platform-builds.yml
    secrets: inherit

  desktop:
    name: Test and build desktop bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun x tsc --noEmit
      - run: bun test
      - name: Build and validate desktop bundle
        run: bun scripts/build-release.ts --target=desktop
      - uses: actions/upload-artifact@v4
        with:
          name: centipede-desktop-release-bundle
          path: release/desktop/
          if-no-files-found: error

  ios-testflight:
    name: Upload signed iOS IPA to TestFlight
    needs: [platforms, desktop]
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: centipede-ios-release-ipa
          path: release/ios
      - name: Prepare App Store Connect API key
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_PRIVATE_KEY_BASE64: ${{ secrets.ASC_API_PRIVATE_KEY_BASE64 }}
        run: |
          test -n "$ASC_API_KEY_ID" -a -n "$ASC_API_ISSUER_ID" -a -n "$ASC_API_PRIVATE_KEY_BASE64" || { echo 'Missing App Store Connect API key secrets.' >&2; exit 1; }
          node -e 'const fs=require("fs"); const k=Buffer.from(process.env.ASC_API_PRIVATE_KEY_BASE64,"base64").toString("utf8"); fs.writeFileSync(process.env.RUNNER_TEMP+"/asc-api-key.json", JSON.stringify({key_id:process.env.ASC_API_KEY_ID,issuer_id:process.env.ASC_API_ISSUER_ID,key:k}));'
      - name: Upload IPA after all platform and desktop builds pass
        env:
          API_KEY_PATH: ${{ runner.temp }}/asc-api-key.json
        run: |
          gem install fastlane --no-document
          IPA_PATH=$(find release/ios -name '*.ipa' -print -quit)
          test -n "$IPA_PATH"
          fastlane pilot upload --ipa "$IPA_PATH" --api_key_path "$API_KEY_PATH" --skip_waiting_for_build_processing true

  publish:
    name: Package manifests and publish verified assets
    needs: [platforms, desktop, ios-testflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          path: release/platforms
      - name: Place desktop asset in canonical target directory
        run: |
          mkdir -p release/desktop
          cp release/platforms/centipede-desktop-release-bundle/* release/desktop/
      - name: Validate every platform artifact and generate target manifests
        run: bun scripts/create-platform-release-manifest.ts
      - name: Publish verified target assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/desktop/*
            release/iso/*
            release/live-usb/*
            release/vm/*
            release/android/*
            release/ios/*
            release/docker/*
            release/manifests/*.json
            release/release-manifest.json
            release/SHA256SUMS
          draft: false
          prerelease: false
          generate_release_notes: true
