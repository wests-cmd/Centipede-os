name: "Centipede OS Production Multi-Distribution Release Pipeline"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: "Release target"
        required: true
        type: choice
        default: "all"
        options:
          - all
          - desktop
          - iso
          - live-usb
          - vm
          - android
          - ios

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build & Publish Release Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Static Type Check
        run: bun x tsc --noEmit

      - name: Run Unit & Security Test Suite
        run: bun test

      - name: Build Multi-Distribution Release Artifacts
        run: bun scripts/build-release.ts --target=${{ inputs.target || 'all' }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            release/**/*.tar.gz
            release/**/*.iso
            release/**/*.img
            release/**/*.qcow2
            release/**/*.apk
            release/**/*.ipa
            release/SHA256SUMS
            release/release-manifest.json
            release/manifests/*.json
          draft: false
          prerelease: false
          generate_release_notes: true
