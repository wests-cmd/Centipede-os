name: Centipede platform builds

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - 'codex/**'
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  android-debug:
    name: Android debug APK (branch validation)
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
      - name: Install Android SDK platform and build tools
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx cap sync android
      - name: Build and verify debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          mkdir -p ../platform-output/android
          VERSION=$(node -p "require('../package.json').version")
          cp app/build/outputs/apk/debug/app-debug.apk "../platform-output/android/centipede-android-${VERSION}-debug.apk"
          sha256sum ../platform-output/android/*.apk > ../platform-output/android/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: centipede-android-debug-apk
          path: platform-output/android/

  android-release:
    name: Signed Android release APK
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
      - name: Install Android SDK platform and build tools
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx cap sync android
      - name: Decode Android release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'Missing ANDROID_KEYSTORE_BASE64 secret.' >&2; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/centipede-release.keystore"
          test -s "$RUNNER_TEMP/centipede-release.keystore"
      - name: Build and verify signed APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/centipede-release.keystore
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEY_ALIAS" -a -n "$ANDROID_KEYSTORE_PASSWORD" -a -n "$ANDROID_KEY_PASSWORD"
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk
          mkdir -p ../platform-output/android
          VERSION=$(node -p "require('../package.json').version")
          cp app/build/outputs/apk/release/app-release.apk "../platform-output/android/centipede-android-${VERSION}-release.apk"
          sha256sum ../platform-output/android/*.apk > ../platform-output/android/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: centipede-android-release-apk
          path: platform-output/android/
          if-no-files-found: error

  ios-simulator:
    name: iOS Simulator app (not for iPhone distribution)
    runs-on: macos-15
    if: github.ref_type != 'tag'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx cap sync ios
      - name: Build simulator app
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-simulator CODE_SIGNING_ALLOWED=NO build
          mkdir -p platform-output/ios-simulator
          ditto -c -k --sequesterRsrc --keepParent build/ios-simulator/Build/Products/Release-iphonesimulator/App.app platform-output/ios-simulator/centipede-ios-simulator.zip
          shasum -a 256 platform-output/ios-simulator/centipede-ios-simulator.zip > platform-output/ios-simulator/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: centipede-ios-simulator-app
          path: platform-output/ios-simulator/

  ios-device:
    name: Signed iOS device IPA
    if: github.ref_type == 'tag'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx cap sync ios
      - name: Import distribution signing certificate and profile
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          test -n "$IOS_CERTIFICATE_BASE64" -a -n "$IOS_CERTIFICATE_PASSWORD" -a -n "$IOS_PROVISIONING_PROFILE_BASE64" || { echo 'Missing iOS distribution signing secrets.' >&2; exit 1; }
          CERT="$RUNNER_TEMP/centipede-distribution.p12"
          PROFILE="$RUNNER_TEMP/centipede.mobileprovision"
          KEYCHAIN="$RUNNER_TEMP/centipede-build.keychain-db"
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE"
          security create-keychain -p "$RUNNER_TEMP/keychain-password" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$RUNNER_TEMP/keychain-password" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$RUNNER_TEMP/keychain-password" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
      - name: Archive and export installable iOS app
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        run: |
          test -n "$IOS_TEAM_ID" -a -n "$IOS_PROFILE_NAME" || { echo 'Missing IOS_TEAM_ID or IOS_PROFILE_NAME secret.' >&2; exit 1; }
          VERSION=$(node -p "require('./package.json').version")
          BUILD_NUMBER=$(node -e 'const [a,b,c]=require("./package.json").version.split(".").map(Number); const r=require("./release/targets.json").targets.ios.revision; console.log(a*10000000+b*100000+c*100+r)')
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -archivePath build/Centipede.xcarchive -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKETING_VERSION="$VERSION" archive
          cat > build/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>method</key><string>app-store-connect</string><key>teamID</key><string>${{ secrets.IOS_TEAM_ID }}</string><key>signingStyle</key><string>manual</string><key>provisioningProfiles</key><dict><key>com.westscmd.centipedeos</key><string>${{ secrets.IOS_PROFILE_NAME }}</string></dict></dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/Centipede.xcarchive -exportOptionsPlist build/ExportOptions.plist -exportPath build/export
          mkdir -p platform-output/ios
          cp build/export/*.ipa "platform-output/ios/centipede-ios-${VERSION}.ipa"
          shasum -a 256 platform-output/ios/*.ipa > platform-output/ios/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: centipede-ios-release-ipa
          path: platform-output/ios/
          if-no-files-found: error

  os-images:
    name: Debian live ISO, USB image, and QEMU disk
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install Debian Bookworm live-build and image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl debootstrap debian-archive-keyring qemu-utils qemu-system-x86 file unzip
          curl --fail --silent --show-error --location https://deb.debian.org/debian/pool/main/l/live-build/live-build_20230502_all.deb --output "$RUNNER_TEMP/live-build_20230502_all.deb"
          sudo apt-get install -y "$RUNNER_TEMP/live-build_20230502_all.deb"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Build bootable images
        run: sudo -E bash scripts/build-live-image.sh
      - name: Restore artifact ownership for QEMU and upload
        run: sudo chown -R "$(id -u):$(id -g)" release/iso release/live-usb release/vm
      - name: Validate image outputs
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ISO="centipede-os-${VERSION}-x86_64.iso"
          USB="centipede-os-${VERSION}-live-usb-x86_64.iso"
          VM="centipede-os-${VERSION}-x86_64.qcow2"
          test -s "release/iso/$ISO"
          test -s "release/live-usb/$USB"
          test -s "release/vm/$VM"
          cmp "release/iso/$ISO" "release/live-usb/$USB"
          qemu-img check "release/vm/$VM"
          QEMU_STATUS=0
          timeout 120s qemu-system-x86_64 -machine pc,accel=tcg -cpu max -smp 2 -m 4096 -drive "file=release/vm/$VM,format=qcow2,if=ide" -boot order=c -display none -serial file:/tmp/centipede-vm-serial.log -monitor none -no-reboot || QEMU_STATUS=$?
          cat /tmp/centipede-vm-serial.log
          test "$QEMU_STATUS" -eq 0 -o "$QEMU_STATUS" -eq 124
          grep -Eiq 'Linux version|live-boot' /tmp/centipede-vm-serial.log
          cd release
          sha256sum iso/* live-usb/* vm/*.qcow2 > platform-SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: centipede-iso-live-usb-vm
          path: |
            release/iso/
            release/live-usb/
            release/vm/
            release/platform-SHA256SUMS
          if-no-files-found: error

  docker:
    name: Build and smoke-test Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        env:
          IMAGE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: docker build --pull -t centipede-web:${IMAGE_TAG} .
      - name: Smoke-test container
        env:
          IMAGE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: |
          docker run -d --name centipede-smoke -p 127.0.0.1:3000:3000 centipede-web:${IMAGE_TAG}
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ > /tmp/centipede-index.html; then break; fi
            sleep 2
          done
          grep -q '<div id="root"></div>' /tmp/centipede-index.html
          CSS_PATH=$(grep -oE 'href="[^"]+\.css"' /tmp/centipede-index.html | head -1 | cut -d'"' -f2)
          test -n "$CSS_PATH"
          curl --fail --silent "http://127.0.0.1:3000${CSS_PATH}" | grep -q -- '--tw-'
          for attempt in $(seq 1 30); do
            HEALTH=$(docker inspect --format='{{.State.Health.Status}}' centipede-smoke)
            [ "$HEALTH" = healthy ] && break
            sleep 2
          done
          [ "$HEALTH" = healthy ]
          VERSION=$(node -p "require('./package.json').version")
          docker save centipede-web:${IMAGE_TAG} -o "centipede-docker-image-${VERSION}.tar"
          sha256sum centipede-docker-image-*.tar > SHA256SUMS
      - if: always()
        name: Clean up smoke container
        run: docker rm -f centipede-smoke || true
      - uses: actions/upload-artifact@v4
        with:
          name: centipede-docker-image
          path: |
            centipede-docker-image-*.tar
            SHA256SUMS
          if-no-files-found: error

