name: Verified Centipede mobile signing
on:
  workflow_dispatch:
  push:
    branches: [fix/mobile-publication-signing]
permissions:
  contents: read
jobs:
  android-release:
    name: Signed Android release APK
    if: vars.CENTIPEDE_ENABLE_SIGNED_ANDROID_RELEASE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
      - name: Install Android SDK platform and build tools
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx cap sync android
      - name: Decode Android release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'Missing ANDROID_KEYSTORE_BASE64 secret.' >&2; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/centipede-release.keystore"
          test -s "$RUNNER_TEMP/centipede-release.keystore"
      - name: Build and verify signed APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/centipede-release.keystore
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_EXPECTED_CERT_SHA256: ${{ vars.ANDROID_EXPECTED_CERT_SHA256 }}
        run: |
          test -n "$ANDROID_KEY_ALIAS" -a -n "$ANDROID_KEYSTORE_PASSWORD" -a -n "$ANDROID_KEY_PASSWORD"
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk
          test -n "$ANDROID_EXPECTED_CERT_SHA256" || { echo 'Missing ANDROID_EXPECTED_CERT_SHA256 repository variable.' >&2; exit 1; }
          ACTUAL_CERT_SHA256=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' | head -1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          EXPECTED_CERT_SHA256=$(printf '%s' "$ANDROID_EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256" || { echo 'APK certificate fingerprint differs from the pinned publisher certificate.' >&2; exit 1; }
          mkdir -p ../platform-output/android
          VERSION=$(node -p "require('../package.json').version")
          cp app/build/outputs/apk/release/app-release.apk "../platform-output/android/centipede-android-${VERSION}-release.apk"
          sha256sum ../platform-output/android/*.apk > ../platform-output/android/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: centipede-android-release-apk
          path: platform-output/android/
          if-no-files-found: error

      - name: Enable hardware acceleration for emulator smoke test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch the signed APK on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install android/app/build/outputs/apk/release/app-release.apk
            adb shell am start -W -n com.westscmd.centipedeos/.MainActivity
            sleep 8
            adb shell dumpsys activity activities > platform-output/android/activity.txt
            grep -q 'com.westscmd.centipedeos' platform-output/android/activity.txt
            adb shell uiautomator dump /sdcard/centipede-ui.xml
            adb pull /sdcard/centipede-ui.xml platform-output/android/centipede-ui.xml
            grep -iq 'Centipede' platform-output/android/centipede-ui.xml
            adb exec-out screencap -p > platform-output/android/centipede-android.png
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: centipede-android-device-evidence
          path: platform-output/android/
  ios-simulator:
    name: iOS Simulator app (not for iPhone distribution)
    runs-on: macos-15
    if: github.ref_type != 'tag'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx cap sync ios
      - name: Build simulator app
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-simulator CODE_SIGNING_ALLOWED=NO build
          mkdir -p platform-output/ios-simulator
          ditto -c -k --sequesterRsrc --keepParent build/ios-simulator/Build/Products/Release-iphonesimulator/App.app platform-output/ios-simulator/centipede-ios-simulator.zip
          shasum -a 256 platform-output/ios-simulator/centipede-ios-simulator.zip > platform-output/ios-simulator/SHA256SUMS
      - name: Boot iPhone Simulator and smoke test Centipede
        run: |
          DEVICE_UDID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(device["udid"] for values in devices.values() for device in values if device["name"].startswith("iPhone ")))')
          test -n "$DEVICE_UDID"
          xcrun simctl boot "$DEVICE_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b
          xcrun simctl install "$DEVICE_UDID" build/ios-simulator/Build/Products/Release-iphonesimulator/App.app
          xcrun simctl launch --terminate-running-process "$DEVICE_UDID" com.westscmd.centipedeos
          sleep 10
          xcrun simctl io "$DEVICE_UDID" screenshot platform-output/ios-simulator/centipede-startup.png
      - uses: actions/upload-artifact@v4
        with:
          name: centipede-ios-simulator-app
          path: platform-output/ios-simulator/
