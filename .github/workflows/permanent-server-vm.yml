name: Centipede disposable permanent server acceptance
on:
  push:
    branches: ['server/permanent-installer-*']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests/headless_server -v
  disposable-install:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 xorriso openssh-client
      - uses: actions/download-artifact@v4
        with:
          name: centipede-server-candidate-801315d801c3d4e77297510d4d27a014e39ac031
          run-id: 38774261379
          github-token: ${{ github.token }}
          path: candidate
      - name: Install to disposable VM target and boot without ISO
        run: python3 scripts/qemu-permanent-server-acceptance.py candidate/iso/centipede-os-1.0.1-server-x86_64.iso --output acceptance-proof
      - name: Preserve acceptance evidence (never private test keys)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: centipede-permanent-server-proof-${{ github.sha }}
          path: acceptance-proof
          if-no-files-found: warn
          retention-days: 7
