name: "Centipede OS Continuous Integration"

on:
  push:
    branches:
      - main
      - 'jules-*'
  pull_request:
    branches:
      - main

jobs:
  local-inference-harness:
    name: Local inference safety harness (no model)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
      - name: Test benchmark safety and Linux process cleanup
        run: python3 -m unittest discover -s scripts -p 'test_local_*.py' -v
      - name: Test boot-menu branding and recovery fallback
        run: python3 -m unittest discover -s scripts -p test_boot_branding.py -v

  validate:
    name: Typecheck, Test & Build Validation
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CENTIPEDE_E2E_PYTHON: python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Reject known vulnerable locked dependencies
        run: bun audit

      - name: Static Type Check
        run: bun x tsc --noEmit

      - name: Verify release reality gate on every change
        run: bun run lint:reality

      - name: Run Unit & Security Test Suite
        run: bun test

      - name: Verify selected knowledge sources through actual Bun HTTP
        run: bun tests/integration/selected_knowledge_sources.integration.ts

      - name: Install Playwright browser for end-to-end interaction tests
        run: bun x playwright install --with-deps chromium

      - name: Run complete desktop and companion interaction checks
        env:
          CENTIPEDE_E2E_PORT: 3100
          CENTIPEDE_E2E_KINGDOM_PORT: 8100
        run: bun x playwright test

      - name: Save end-to-end screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: centipede-e2e-screenshots-${{ matrix.os }}
          path: test-results/*.png
          if-no-files-found: warn

      - name: Verify Release Build Execution
        run: bun run build:release

      - name: Smoke-test the actual compiled web and API runtime
        run: |
          bun build --compile src/server/production.ts --outfile build/centipede-server
          python scripts/smoke-packaged-server.py --binary build/centipede-server --web-root dist

