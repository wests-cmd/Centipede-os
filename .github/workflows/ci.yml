name: "Centipede OS Continuous Integration"

on:
  push:
    branches:
      - main
      - 'jules-*'
  pull_request:
    branches:
      - main

jobs:
  local-inference-harness:
    name: Local inference safety harness (no model)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
      - name: Test benchmark safety and Linux process cleanup
        run: python3 -m unittest discover -s scripts -p test_local_inference_benchmark.py -v
      - name: Test boot-menu branding and recovery fallback
        run: python3 -m unittest discover -s scripts -p test_boot_branding.py -v

  validate:
    name: Typecheck, Test & Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Static Type Check
        run: bun x tsc --noEmit

      - name: Run Unit & Security Test Suite
        run: bun test

      - name: Install Playwright browser for end-to-end interaction tests
        run: bun x playwright install --with-deps chromium

      - name: Run complete desktop and companion interaction checks
        env:
          CENTIPEDE_E2E_PORT: 3100
          CENTIPEDE_E2E_KINGDOM_PORT: 8100
        run: bun x playwright test

      - name: Save end-to-end screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: centipede-e2e-screenshots
          path: test-results/*.png
          if-no-files-found: warn

      - name: Verify Release Build Execution
        run: bun run build:release

