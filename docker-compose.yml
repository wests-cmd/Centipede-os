services:
  centipede-web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      PUBLIC_URL: ${CENTIPEDE_PUBLIC_URL:-http://localhost:3000}
      KINGDOM_API_URL: ${KINGDOM_API_URL:-http://host.docker.internal:8000}
      KINGDOM_API_TOKEN: ${KINGDOM_API_TOKEN:-}
    restart: unless-stopped
