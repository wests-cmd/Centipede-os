version: '3.8'

services:
  # --- 1. KINGDOM RUNTIME ENGINE ---
  kingdom-engine:
    image: python:3.11-slim
    container_name: centipede-kingdom-engine
    environment:
      - PORT=8000
      - ZERO_TRUST_MODE=true
    networks:
      - centipede-net
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/status\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - kingdom-data:/app/data
    restart: unless-stopped

  # --- 2. CENTIPEDE OS DESKTOP SHELL ---
  centipede-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: centipede-os-ui
    environment:
      - PORT=3000
      - KINGDOM_API_URL=http://kingdom-engine:8000
      - OLLAMA_API_URL=http://ollama-model:11434
    networks:
      - centipede-net
    ports:
      - "3000:3000"
    depends_on:
      kingdom-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
    volumes:
      - centipede-data:/app/data
    restart: unless-stopped

networks:
  centipede-net:
    driver: bridge

volumes:
  kingdom-data:
  centipede-data:
