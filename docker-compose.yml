version: '3.8'

services:
  # --- 1. KINGDOM DISTRIBUTED RUNTIME ENGINE ---
  kingdom-engine:
    image: python:3.11-slim
    container_name: centipede-kingdom-engine
    environment:
      - PORT=8000
      - ZERO_TRUST_MODE=true
    networks:
      - centipede-net
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/status\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - kingdom-data:/app/data
    restart: unless-stopped

  # --- 2. COMMANDER NODE (Control & Orchestration Workstation) ---
  commander-node:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: centipede-commander
    environment:
      - PORT=3000
      - CENTIPEDE_PROFILE=FULL_CENTIPEDE
      - KINGDOM_API_URL=http://kingdom-engine:8000
      - OLLAMA_API_URL=http://ollama-model:11434
    networks:
      - centipede-net
    ports:
      - "3000:3000"
    depends_on:
      kingdom-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
    volumes:
      - commander-data:/app/data
    restart: unless-stopped

  # --- 3. KNIGHT NODE (Workload Execution Worker) ---
  knight-node:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: centipede-knight
    environment:
      - PORT=3001
      - CENTIPEDE_PROFILE=KNIGHT
      - KINGDOM_API_URL=http://kingdom-engine:8000
    networks:
      - centipede-net
    ports:
      - "3001:3000"
    depends_on:
      kingdom-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
    volumes:
      - knight-data:/app/data
    restart: unless-stopped

  # --- 4. SCOUT NODE (Environment Discovery Agent) ---
  scout-node:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: centipede-scout
    environment:
      - PORT=3002
      - CENTIPEDE_PROFILE=SCOUT
      - KINGDOM_API_URL=http://kingdom-engine:8000
    networks:
      - centipede-net
    ports:
      - "3002:3000"
    depends_on:
      kingdom-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
    volumes:
      - scout-data:/app/data
    restart: unless-stopped

networks:
  centipede-net:
    driver: bridge

volumes:
  kingdom-data:
  commander-data:
  knight-data:
  scout-data:
